<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Konfigurátor skleněných dveří — Sklospeciál</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="./konfigurator.css" />
</head>
<body>
  <main class="wrap" x-data="konfigurator()" x-cloak>
    <header class="head">
      <p class="brand">Sklospeciál</p>
      <h1>Konfigurátor skleněných dveří</h1>
      <p class="lead">Pošli rozměry a fotky — připravíme nabídku.</p>
      <div class="progress" role="status">Krok <strong x-text="krok"></strong> / 7</div>
      <div class="bar"><span :style="`width:${(krok/7)*100}%`"></span></div>
    </header>

    <section class="card" x-show="krok===1">
      <h2>Typ dveří</h2>
      <div class="grid">
        <template x-for="o in options.typ" :key="o.v">
          <button type="button" class="choice" :class="config.typ_dveri===o.v && 'on'" @click="config.typ_dveri=o.v" x-text="o.l"></button>
        </template>
      </div>
    </section>

    <section class="card" x-show="krok===2">
      <h2>Použití</h2>
      <div class="grid">
        <template x-for="o in options.pouziti" :key="o.v">
          <button type="button" class="choice" :class="config.pouziti===o.v && 'on'" @click="config.pouziti=o.v" x-text="o.l"></button>
        </template>
      </div>
    </section>

    <section class="card" x-show="krok===3">
      <h2>Rozměry (mm)</h2>
      <p class="hint">Měř na 3 místech. Pracujeme s nejmenší hodnotou.</p>
      <fieldset>
        <legend>Šířka otvoru</legend>
        <div class="row3">
          <label>Vlevo <input type="number" min="300" max="3500" x-model.number="config.rozmery.sirka[0]" /></label>
          <label>Uprostřed <input type="number" min="300" max="3500" x-model.number="config.rozmery.sirka[1]" /></label>
          <label>Vpravo <input type="number" min="300" max="3500" x-model.number="config.rozmery.sirka[2]" /></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Výška otvoru</legend>
        <div class="row3">
          <label>Vlevo <input type="number" min="300" max="3500" x-model.number="config.rozmery.vyska[0]" /></label>
          <label>Uprostřed <input type="number" min="300" max="3500" x-model.number="config.rozmery.vyska[1]" /></label>
          <label>Vpravo <input type="number" min="300" max="3500" x-model.number="config.rozmery.vyska[2]" /></label>
        </div>
      </fieldset>
      <label>Hloubka stěny (mm)
        <input type="number" min="20" max="800" x-model.number="config.rozmery.hloubka" />
      </label>
    </section>

    <section class="card" x-show="krok===4">
      <h2>Typ skla</h2>
      <div class="grid">
        <template x-for="o in options.sklo" :key="o.v">
          <button type="button" class="choice" :class="config.typ_skla===o.v && 'on'" @click="config.typ_skla=o.v" x-text="o.l"></button>
        </template>
      </div>
    </section>

    <section class="card" x-show="krok===5">
      <h2>Kování</h2>
      <div class="grid">
        <template x-for="o in options.kovani" :key="o.v">
          <button type="button" class="choice" :class="config.kovani===o.v && 'on'" @click="config.kovani=o.v" x-text="o.l"></button>
        </template>
      </div>
    </section>

    <section class="card" x-show="krok===6">
      <h2>Montáž</h2>
      <div class="grid">
        <template x-for="o in options.montaz" :key="o.v">
          <button type="button" class="choice" :class="config.montaz===o.v && 'on'" @click="config.montaz=o.v" x-text="o.l"></button>
        </template>
      </div>
    </section>

    <section class="card" x-show="krok===7">
      <h2>Fotky a kontakt</h2>
      <p class="hint">2–8 fotek, max 5 MB, JPG/PNG/WebP.</p>
      <input type="file" accept="image/jpeg,image/png,image/webp" multiple @change="onFiles($event)" />
      <p x-show="config.fotky.length" x-text="`Vybráno: ${config.fotky.length} souborů`"></p>
      <div class="form">
        <label>Jméno <input x-model="config.kontakt.jmeno" /></label>
        <label>Telefon <input x-model="config.kontakt.telefon" placeholder="+420…" /></label>
        <label>E-mail <input type="email" x-model="config.kontakt.email" /></label>
        <label>Město / PSČ <input x-model="config.kontakt.mesto" /></label>
        <label>Poznámka <textarea x-model="config.kontakt.poznamka" rows="3"></textarea></label>
      </div>
    </section>

    <p class="error" x-show="error" x-text="error"></p>
    <p class="ok" x-show="done" x-text="done"></p>

    <footer class="actions">
      <button type="button" class="ghost" @click="back()" :disabled="krok===1 || sending">Zpět</button>
      <button type="button" class="primary" x-show="krok<7" @click="next()">Pokračovat</button>
      <button type="button" class="primary" x-show="krok===7" @click="submit()" :disabled="sending" x-text="sending ? 'Odesílám…' : 'Odeslat poptávku'"></button>
    </footer>
  </main>
  <script src="./konfigurator.js"></script>
</body>
</html>
